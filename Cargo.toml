[package]
name = "homeos"
version = "0.3.19"
edition = "2024"
rust-version = "1.85"
description = "An AI-agent-driven CLI for keeping install scripts reproducible across machines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hainet50b/homeos"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "= 4.6.5", features = ["unstable-dynamic"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
yaml_serde = "0.10"

[dev-dependencies]
tempfile = "3"
